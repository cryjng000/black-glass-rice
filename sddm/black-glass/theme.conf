[General]
# Wallpaper: relative to this theme folder, or an absolute path (e.g. /usr/share/backgrounds/dark.png).
# Any image works; it is desaturated, darkened and blurred by the theme.
background=assets/background.png

# Font family. "Inter" (Arch package: inter-font) is closest to Apple's typography.
# If the family is not installed, Qt falls back to the system sans-serif.
fontFamily=Inter

# GPU blur / frosted glass (needs OpenGL; set to false on software rendering).
enableBlur=true

# Strength of the wallpaper blur, 0.0 - 1.0
backgroundBlur=0.55

# true = 21:41, false = 9:41
clock24h=true
