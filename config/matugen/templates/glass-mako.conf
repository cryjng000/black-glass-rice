# Generated by Matugen from ~/.config/matugen/templates/glass-mako.conf
# Edit the template, not this file.

# --- layout -----------------------------------------------------------
font=JetBrainsMono Nerd Font 10
anchor=top-right
layer=overlay
width=360
height=150
outer-margin=14
margin=6
padding=14,16
max-visible=5
sort=-time

# --- shape / colour ---------------------------------------------------
border-size=1
border-radius=14
background-color=#{{colors.surface_container_lowest.dark.hex_stripped}}d1
text-color=#{{colors.on_surface.dark.hex_stripped}}
border-color=#{{colors.primary.dark.hex_stripped}}59
progress-color=over #{{colors.primary.dark.hex_stripped}}cc

# --- content ----------------------------------------------------------
markup=1
actions=1
icons=1
max-icon-size=40
icon-location=left
history=1
max-history=50
format=<b>%s</b>\n<span alpha="75%">%b</span>

# --- timeouts (ms) ----------------------------------------------------
default-timeout=6000
ignore-timeout=0

[urgency=low]
default-timeout=3000
text-color=#{{colors.on_surface_variant.dark.hex_stripped}}
border-color=#{{colors.outline_variant.dark.hex_stripped}}66
progress-color=over #{{colors.outline.dark.hex_stripped}}99

[urgency=critical]
default-timeout=0
border-size=2
border-color=#{{colors.error.dark.hex_stripped}}e6
progress-color=over #{{colors.error.dark.hex_stripped}}cc
