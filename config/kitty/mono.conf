# mono-term: pulled in with `include mono.conf` at the END of kitty.conf.
# Later settings win, so this layer only overrides what it names.
# cursor_trail needs kitty >= 0.37. Older kitty warns about it and carries on.
include theme.conf

# --- text ----------------------------------------------------------------
# font_family is NOT set here. The installer writes font.conf if it finds a Nerd Font.
font_size 12.0
modify_font cell_height 108%
text_composition_strategy 1.0 0
disable_ligatures cursor

# --- transparency (blur comes from Hyprland, not kitty) ------------------
background #000000
foreground #d8d8d8
background_opacity 0.80
dynamic_background_opacity yes

# --- cursor --------------------------------------------------------------
cursor #f2f2f2
cursor_text_color #000000
cursor_shape beam
cursor_shape_unfocused hollow
cursor_beam_thickness 1.6
cursor_underline_thickness 2.0
cursor_blink_interval 0.55 ease-in-out
cursor_stop_blinking_after 15.0
cursor_trail 120
cursor_trail_decay 0.08 0.35
cursor_trail_start_threshold 3

# --- selection -----------------------------------------------------------
selection_background #d8d8d8
selection_foreground #000000

# --- window --------------------------------------------------------------
window_padding_width 10 14
window_border_width 0
draw_minimal_borders yes
hide_window_decorations yes
confirm_os_window_close 0
tab_bar_style hidden
enable_audio_bell no

# --- scrolling / performance --------------------------------------------
scrollback_lines 10000
wheel_scroll_multiplier 3.0
touch_scroll_multiplier 4.0
repaint_delay 8
input_delay 2
sync_to_monitor yes
